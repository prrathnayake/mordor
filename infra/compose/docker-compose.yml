services:
  redis:
    image: redis:7-alpine
    container_name: mordor-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: mordor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chrona
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    container_name: mordor-api
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      REDIS_URL: redis://redis:6379
      AUTH_ENABLED: true
      AUTH_PASSWORD_VIEWER: viewer123
      AUTH_PASSWORD_OPERATOR: operator123
      AUTH_PASSWORD_ADMIN: admin123
      CORS_ALLOWED_ORIGIN: "*"
      LOG_LEVEL: info
      ENABLE_LIVE_WORLD_SERVICE: true
      LIVE_FLIGHTS_REFRESH_MS: 120000
      LIVE_FLIGHTS_CACHE_TTL_MS: 300000
      LIVE_FLIGHT_HISTORY_POINTS: 18
      LIVE_FLIGHT_LIMIT: 7000
      AUTO_REFRESH_EXTERNAL_LAYERS: true
      SWAN_ARTIFACT_ROOT: /app/runtime/swan
      SWAN_MAX_THREADS_PER_SESSION: 5
      SWAN_MAX_GLOBAL_THREADS: 20
      SWAN_SESSION_IDLE_TTL_MS: 1800000
      SWAN_WATCH_INTERVAL_MS: 60000
      SWAN_PROVIDER_ALLOWLIST: app_context,existing_external_layers,external_research
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      target: runner
    container_name: mordor-web
    environment:
      NODE_ENV: production
      WEB_PORT: 3001
      API_BASE_URL: http://localhost:3000
      MAP_IMAGERY_PROVIDER: arcgis-world-imagery
      MAP_IMAGERY_MAX_LEVEL: 19
      STREET_SCENE_PROVIDER: none
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    container_name: mordor-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      WORKER_INPUT_FILE: /app/worker-input.json
      AUTH_PASSWORD_VIEWER: viewer123
      AUTH_PASSWORD_OPERATOR: operator123
      AUTH_PASSWORD_ADMIN: admin123
    volumes:
      - ./worker-input.json:/app/worker-input.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx apps/worker/src/index.ts
    restart: "no"

  agent-collector:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    container_name: mordor-agent-collector
    environment:
      NODE_ENV: production
      AGENT_MODE: collector
      AGENT_ID: collector-01
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      REDIS_URL: redis://redis:6379
      AUTH_PASSWORD_VIEWER: viewer123
      AUTH_PASSWORD_OPERATOR: operator123
      AUTH_PASSWORD_ADMIN: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx apps/agents/src/index.ts
    restart: unless-stopped

  agent-detector:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    container_name: mordor-agent-detector
    environment:
      NODE_ENV: production
      AGENT_MODE: detector
      AGENT_ID: detector-01
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      REDIS_URL: redis://redis:6379
      AUTH_PASSWORD_VIEWER: viewer123
      AUTH_PASSWORD_OPERATOR: operator123
      AUTH_PASSWORD_ADMIN: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx apps/agents/src/index.ts
    restart: unless-stopped

  agent-publisher:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: runner
    container_name: mordor-agent-publisher
    environment:
      NODE_ENV: production
      AGENT_MODE: publisher
      AGENT_ID: publisher-01
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      REDIS_URL: redis://redis:6379
      AUTH_PASSWORD_VIEWER: viewer123
      AUTH_PASSWORD_OPERATOR: operator123
      AUTH_PASSWORD_ADMIN: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx apps/agents/src/index.ts
    restart: unless-stopped

volumes:
  postgres_data:
