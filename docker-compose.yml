services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: mordor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chrona
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mordor-api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      JWT_SECRET: mordor-dev-secret-change-in-production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    command: npx tsx apps/api/src/server.ts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: mordor-web
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    command: npx tsx apps/web/src/server.ts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mordor-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chrona
      WORKER_INPUT_FILE: /app/worker-input.json
    volumes:
      - ./worker-input.json:/app/worker-input.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    command: npx tsx apps/worker/src/index.ts

volumes:
  postgres_data:
